services:
  skilldock:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${SKILLDOCK_PUBLIC_URL:-http://localhost}
    restart: unless-stopped
    ports:
      - "${SKILLDOCK_HTTP_PORT:-80}:3000"
    volumes:
      - skilldock-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  skilldock-data:
